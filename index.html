<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Library</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Web Audio Prep</h1>
        <p> Upload to scroll through your music while it plays at different speeds</p>
        <p> If nothing to upload, just click Play</p>
        <p> Negative values on Playback Speed will rewind the audio </p>
    </header>
    <main>
        <section id="upload">
            <h2>Upload Audio Files</h2>
            <form id="uploadForm">
                <input type="file" id="audio-file" accept=".mp3,.wav,.flac" multiple>
                <button type="submit">Upload</button>
            </form>
        </section>
        <section id="playback">
            <h2>
                Playback Speed
                <div id="controls">
                <label>Speed: <span id="speed-label">1.0x</span></label>
                <input type="range" id="speed-slider" min="-2.0" max="2.0" step="0.01" value="1">
            </div>
            <div id="player-controls">
                <span id="current-file">No file loaded</span>
                <button id="play-button" disabled>Play</button>
                <button id="rewind-button" disabled>Rewind</button>
                <button id="fast-forward-button" disabled>Fast Forward 1s</button>
            </div>
            <div id="fine-tune-controls">
                <label>Rewind Step Size(sec): <input type="number" id="rewind-step" value="1" min="0.1" step="0.1"></label>
                <label>Rewind Period (sec): <input type="number" id="rewind-freq" value="0.5" min="0.1" step="0.1"></label>
                <label>Overlap Effect Duration (sec): <input type="number" id="rewind-overlap" value="0.2" min="0" step="0.1"></label>
                <label>Rewind Playback Speed (1 = 1x speed): <input type="number" id="rewind-playback-speed" value="1" min="0.1" step="0.1"></label>
            </div>
            </h2>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
